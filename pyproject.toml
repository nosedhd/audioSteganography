[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "estego"
version = "0.1.0"
description = "Esteganografía en audio: LSB, eco, espectro ensanchado y codificación de fase"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
]

[tool.setuptools.packages.find]
include = ["estego*"]